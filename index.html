<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbos Irregulares</title>
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f9fafb;
    color: #111827;
    min-height: 100vh;
    padding: 24px 16px;
  }

  #app {
    max-width: 640px;
    margin: 0 auto;
  }

  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
  h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; }
  h3 { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }

  .subtitle { color: #6b7280; font-size: 0.875rem; margin-bottom: 20px; }

  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }

  /* Verb / tense checkboxes */
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    background: #f3f4f6; border: 1px solid #d1d5db;
    border-radius: 20px; padding: 4px 12px;
    cursor: pointer; font-size: 0.875rem; user-select: none;
    transition: background 0.15s, border-color 0.15s;
  }
  .chip.selected { background: #ede9fe; border-color: #7c3aed; color: #5b21b6; font-weight: 600; }
  .chip input { display: none; }

  .tense-group { margin-bottom: 14px; }
  .tense-group-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #9ca3af; margin-bottom: 6px; }

  /* Number input */
  .count-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .count-row label { font-size: 0.875rem; color: #374151; }
  .count-row input[type=number] {
    width: 70px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 1rem; text-align: center;
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 20px; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; border: none; transition: opacity 0.15s;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #7c3aed; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #6d28d9; }
  .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
  .btn-secondary:hover { background: #e5e7eb; }
  .btn-full { width: 100%; }

  /* Progress bar */
  .progress-bar-wrap { background: #e5e7eb; border-radius: 99px; height: 6px; margin-bottom: 24px; }
  .progress-bar-fill { background: #7c3aed; border-radius: 99px; height: 6px; transition: width 0.3s; }

  /* Question card */
  .question-label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: #7c3aed; margin-bottom: 6px; }
  .question-prompt { font-size: 1.55rem; font-weight: 800; margin-bottom: 4px; }
  .tense-name { font-size: 1rem; font-weight: 700; color: #374151; margin-bottom: 2px; }
  .mood-tag { font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: #7c3aed; margin-left: 6px; }
  .tense-desc { font-size: 0.8rem; color: #9ca3af; margin-bottom: 18px; }

  /* Text input for mode A */
  .answer-input {
    width: 100%; padding: 12px 16px; font-size: 1.1rem;
    border: 2px solid #d1d5db; border-radius: 8px; outline: none;
    transition: border-color 0.15s;
  }
  .answer-input:focus { border-color: #7c3aed; }
  .answer-input.correct { border-color: #16a34a; background: #f0fdf4; }
  .answer-input.wrong   { border-color: #dc2626; background: #fef2f2; }
  .answer-input.accent  { border-color: #d97706; background: #fffbeb; }

  /* Feedback row */
  .feedback { font-size: 0.9rem; margin-top: 10px; min-height: 20px; }
  .feedback.correct { color: #16a34a; }
  .feedback.wrong   { color: #dc2626; }
  .feedback.accent  { color: #d97706; }

  /* Mode B choices */
  .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .choice-btn {
    text-align: left; padding: 12px 16px; border-radius: 8px;
    border: 2px solid #e5e7eb; background: #fff; cursor: pointer;
    font-size: 0.9rem; transition: border-color 0.15s, background 0.15s;
  }
  .choice-btn:hover:not(:disabled) { border-color: #7c3aed; background: #ede9fe; }
  .choice-btn.selected { border-color: #7c3aed; background: #ede9fe; }
  .choice-btn.correct-reveal { border-color: #16a34a; background: #f0fdf4; }
  .choice-btn.wrong-reveal   { border-color: #dc2626; background: #fef2f2; }

  /* Mode C table */
  .fill-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  .fill-table td { padding: 4px 6px; }
  .fill-table .person-cell { width: 120px; font-size: 0.875rem; color: #6b7280; }
  .fill-table input {
    width: 100%; padding: 7px 10px; border: 1.5px solid #d1d5db; border-radius: 6px;
    font-size: 0.9rem;
  }
  .fill-table input.correct { border-color: #16a34a; background: #f0fdf4; }
  .fill-table input.wrong   { border-color: #dc2626; background: #fef2f2; }
  .fill-table input.accent  { border-color: #d97706; background: #fffbeb; }
  .correction { margin-left: 8px; font-size: 0.875rem; font-weight: 600; }
  .wrong-correction  { color: #dc2626; }
  .accent-correction { color: #d97706; }

  /* Results */
  .score-big { font-size: 3rem; font-weight: 800; color: #7c3aed; text-align: center; }
  .score-pct { text-align: center; color: #6b7280; margin-bottom: 24px; }
  .weak-list { list-style: none; }
  .weak-list li {
    padding: 8px 12px; background: #fef2f2; border-radius: 6px;
    font-size: 0.875rem; color: #991b1b; margin-bottom: 6px;
  }
  .action-row { display: flex; gap: 12px; margin-top: 20px; }
  .action-row .btn { flex: 1; }

  /* Example hint */
  .example-hint {
    font-size: 0.8rem; color: #6b7280; background: #f9fafb;
    border: 1px solid #e5e7eb; border-radius: 6px;
    padding: 8px 12px; margin-bottom: 16px;
  }
  .example-hint strong { color: #374151; }

  /* Vós toggle */
  .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 0.875rem; }
  .toggle-row input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
</style>

// Progress: track correct/incorrect per (verb|mood|tense) key
const Progress = (() => {
  const STORAGE_KEY = 'verbos-progress';

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function record(key, correct) {
    const data = load();
    if (!data[key]) data[key] = { correct: 0, incorrect: 0 };
    if (correct) data[key].correct++; else data[key].incorrect++;
    save(data);
  }

  function getWeight(key) {
    const data = load();
    const p = data[key];
    if (!p) return 1;
    const total = p.correct + p.incorrect;
    if (total === 0) return 1;
    return 1 + (p.incorrect / total) * 2; // range: 1.0 – 3.0
  }

  function getAll() {
    return load();
  }

  return { record, getWeight, getAll };
})();

function normalize(s) { return s.trim().toLowerCase(); }

function stripDiacritics(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

// Returns 'correct' | 'accent-only' | 'wrong'
function checkAnswer(input, expected) {
  if (normalize(input) === normalize(expected)) return 'correct';
  if (stripDiacritics(input) === stripDiacritics(expected)) return 'accent-only';
  return 'wrong';
}

// Returns array of question objects, length = count
// selectedVerbs: array of verb name strings e.g. ['SER', 'IR']
// selectedTenses: { Indicativo: [...], Subjuntivo: [...], Imperativo: [...], FormasNominais: [...] }
// selectedPersons: Set of person indices (0–5) to include in mode A/C questions
function buildQueue(selectedVerbs, selectedTenses, count, selectedPersons) {
  // Build pool of (verb, mood, tense) combos
  const pool = [];
  selectedVerbs.forEach(verb => {
    ['Indicativo','Subjuntivo','Imperativo','FormasNominais'].forEach(mood => {
      const tenses = selectedTenses[mood] || [];
      tenses.forEach(tense => {
        const forms = mood === 'FormasNominais'
          ? VERBS[verb].FormasNominais[tense]
          : VERBS[verb][mood][tense];
        if (!forms) return;
        const key = `${verb}|${mood}|${tense}`;
        pool.push({ verb, mood, tense, forms, weight: Progress.getWeight(key) });
      });
    });
  });

  if (pool.length === 0) return [];

  // Weighted random selection (with replacement)
  const totalWeight = pool.reduce((s, p) => s + p.weight, 0);
  const questions = [];

  // Need at least 4 unique tenses for mode B to have meaningful choices
  const uniqueTenses = new Set(pool.filter(p => typeof p.forms !== 'string').map(p => `${p.mood}|${p.tense}`));
  const canUseB = uniqueTenses.size >= 4;

  let lastKey = null;
  for (let i = 0; i < count; i++) {
    // Pick item by weight, avoiding back-to-back duplicates when possible
    let item;
    for (let attempt = 0; attempt < 5; attempt++) {
      let r = Math.random() * totalWeight;
      item = pool[pool.length - 1];
      for (const p of pool) { r -= p.weight; if (r <= 0) { item = p; break; } }
      if (pool.length <= 1 || `${item.verb}|${item.mood}|${item.tense}` !== lastKey) break;
    }

    const { verb, mood, tense, forms } = item;
    const isSingleForm = typeof forms === 'string';

    // Assign mode
    let mode;
    if (isSingleForm) {
      mode = 'A';
    } else {
      const roll = Math.random();
      if (canUseB && roll < 0.33) mode = 'B';
      else if (roll < 0.66) mode = 'C';
      else mode = 'A';
    }

    // For mode A: pick a random person slot
    let personIndex = null;
    if (mode === 'A' && !isSingleForm) {
      const slots = [0,1,2,3,4,5].filter(i => selectedPersons.has(i) && forms[i] !== '—');
      personIndex = slots[Math.floor(Math.random() * slots.length)];
    }

    // For mode B: build 4 choices (correct tense + 3 distractors from other tenses)
    let choices = null;
    if (mode === 'B') {
      const seen = new Set([`${mood}|${tense}`]);
      const distractors = pool
        .filter(p => typeof p.forms !== 'string')
        .sort(() => Math.random() - 0.5)
        .reduce((acc, p) => {
          const key = `${p.mood}|${p.tense}`;
          if (!seen.has(key)) { seen.add(key); acc.push(p); }
          return acc;
        }, [])
        .slice(0, 3)
        .map(p => ({ verb: p.verb, mood: p.mood, tense: p.tense }));
      choices = [
        { verb, mood, tense, correct: true },
        ...distractors.map(d => ({ ...d, correct: false })),
      ].sort(() => Math.random() - 0.5);
    }

    const example = getExampleVerb(verb, mood, tense);
    questions.push({ verb, mood, tense, forms, mode, personIndex, choices, example });
    lastKey = `${verb}|${mood}|${tense}`;
  }

  return questions;
}

  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
}

function resetSettings() {
  localStorage.removeItem(SETTINGS_KEY);
  renderSetup();
}

// ── Session state ──
let currentQueue = [];
let currentIndex = 0;
let sessionResults = [];
let sessionSetup = null;

const TENSE_GROUPS = {
  Indicativo: [
    "Presente","Pretérito Imperfeito","Pretérito Perfeito simples",
    "Pretérito Perfeito composto","Pretérito mais-que-perfeito simples",
    "Pretérito mais-que-perfeito composto","Futuro do Presente simples",
    "Futuro do Presente composto","Futuro do Pretérito simples","Futuro do Pretérito composto",
  ],
  Subjuntivo: [
    "Presente","Pretérito Perfeito","Pretérito Imperfeito",
    "Pretérito mais-que-perfeito","Futuro simples","Futuro composto",
  ],
  Imperativo: ["Afirmativo","Negativo"],
  FormasNominais: ["Infinito pessoal","Gerúndio","Particípio"],
};

function getWeakTenses() {
  const all = Progress.getAll();
  return Object.entries(all)
    .filter(([, v]) => v.incorrect > 0)
    .sort((a, b) => b[1].incorrect - a[1].incorrect)
    .slice(0, 5)
    .map(([key]) => key);
}

function moodLabel(mood) {
  return { Indicativo: 'Indicativo', Subjuntivo: 'Subjuntivo',
    Imperativo: 'Imperativo', FormasNominais: 'Formas Nominais' }[mood] || mood;
}

const TENSE_DESC = {
  // Indicativo
  'Indicativo|Presente':                              'present — habitual or ongoing actions',
  'Indicativo|Pretérito Imperfeito':                  'imperfect past — repeated or ongoing past actions',
  'Indicativo|Pretérito Perfeito simples':            'simple past — completed actions',
  'Indicativo|Pretérito Perfeito composto':           'compound past — actions continuing to the present',
  'Indicativo|Pretérito mais-que-perfeito simples':   'past perfect — actions before another past action',
  'Indicativo|Pretérito mais-que-perfeito composto':  'compound past perfect',
  'Indicativo|Futuro do Presente simples':            'future — actions that will happen',
  'Indicativo|Futuro do Presente composto':           'future perfect — actions that will have happened',
  'Indicativo|Futuro do Pretérito simples':           'conditional — actions that would happen',
  'Indicativo|Futuro do Pretérito composto':          'conditional perfect — actions that would have happened',
  // Subjuntivo
  'Subjuntivo|Presente':                             'present subjunctive — wishes, doubts, emotions',
  'Subjuntivo|Pretérito Perfeito':                   'perfect subjunctive — completed hypothetical actions',
  'Subjuntivo|Pretérito Imperfeito':                 'imperfect subjunctive — hypothetical or past wishes',
  'Subjuntivo|Pretérito mais-que-perfeito':          'past perfect subjunctive',
  'Subjuntivo|Futuro simples':                       'future subjunctive — if/when clauses',
  'Subjuntivo|Futuro composto':                      'future perfect subjunctive',
  // Imperativo
  'Imperativo|Afirmativo':                           'affirmative commands — telling someone to do something',
  'Imperativo|Negativo':                             'negative commands — telling someone not to do something',
  // Formas Nominais
  'FormasNominais|Infinito pessoal':                 'personal infinitive — infinitive with a subject',
  'FormasNominais|Gerúndio':                         'gerund — ongoing action (-ing form)',
  'FormasNominais|Particípio':                       'past participle — used in perfect tenses',
};

function getExampleVerb(currentVerb, mood, tense) {
  const others = Object.keys(VERBS).filter(v => v !== currentVerb);
  if (others.length === 0) return null;
  const pick = others[Math.floor(Math.random() * others.length)];
  const moodData = mood === 'FormasNominais' ? VERBS[pick].FormasNominais : VERBS[pick][mood];
  if (!moodData || !moodData[tense]) return null;
  return { verb: pick, forms: moodData[tense] };
}

function renderExampleHint(ex, personIndex) {
  if (!ex) return '';
  if (typeof ex.forms === 'string') {
    return `<div class="example-hint">e.g. <strong>${ex.verb.toLowerCase()}</strong> → ${ex.forms}</div>`;
  }
  if (personIndex != null) {
    const form = ex.forms[personIndex];
    if (form === '—') return '';
    return `<div class="example-hint">e.g. <strong>${ex.verb.toLowerCase()}</strong> (${PERSON_SHORT[personIndex]}) → ${form}</div>`;
  }
  // Full table for mode C
  const rows = PERSONS.map((p, i) => `${PERSON_SHORT[i]}: ${ex.forms[i]}`)
    .filter((_, i) => sessionSetup && sessionSetup.selectedPersons.has(i) && ex.forms[i] !== '—')
    .join(' · ');
  return `<div class="example-hint">e.g. <strong>${ex.verb.toLowerCase()}</strong> → ${rows}</div>`;
}

function tenseHeader(mood, tense) {
  const desc = TENSE_DESC[`${mood}|${tense}`];
  return `
    <div class="tense-name">${tense} <span class="mood-tag">${moodLabel(mood)}</span></div>
    ${desc ? `<div class="tense-desc">${desc}</div>` : ''}
  `;
}

function renderPractice() {
  if (currentIndex >= currentQueue.length) { renderResults(); return; }
  const q = currentQueue[currentIndex];
  const app = document.getElementById('app');

  const pct = Math.round((currentIndex / currentQueue.length) * 100);
  app.innerHTML = `
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width:${pct}%"></div>
    </div>
    <div class="card" id="question-card">
      ${renderQuestion(q)}
    </div>
  `;

  if (q.mode === 'A') {
    const inp = document.getElementById('answer-input');
    if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitModeA(); }); }
  }
  if (q.mode === 'C') {
    const inputs = [...document.querySelectorAll('.fill-input')];
    if (inputs.length) inputs[0].focus();
    inputs.forEach(inp => inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const allFilled = inputs.every(i => i.value.trim() !== '');
      if (allFilled) submitModeC();
    }));
  }
}

function renderQuestion(q) {
  const counter = `<div style="font-size:0.8rem;color:#9ca3af;margin-bottom:8px;">${currentIndex + 1} / ${currentQueue.length}</div>`;
  if (q.mode === 'A') return counter + renderModeA(q);
  if (q.mode === 'B') return counter + renderModeB(q);
  return counter + renderModeC(q);
}

function renderModeA(q) {
  const isSingle = typeof q.forms === 'string';
  const personLabel = isSingle ? '' : `<span class="person-cell" style="display:inline-block;min-width:120px;vertical-align:middle;">${PERSONS[q.personIndex]}</span>`;
  return `
    <div class="question-prompt">${q.verb}</div>
    ${tenseHeader(q.mood, q.tense)}
    ${sessionSetup.showHints ? renderExampleHint(q.example, isSingle ? null : q.personIndex) : ''}
    <div style="display:flex;align-items:center;gap:8px;">
      ${personLabel}
      <input class="answer-input" id="answer-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="type conjugation…">
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="submitModeA()">Check</button>
  `;
}

function renderModeB(q) {
  const sample = Array.isArray(q.forms) ? q.forms.slice(0,4).join(' · ') : q.forms;
  return `
    <div class="question-prompt">${q.verb}</div>
    <div class="question-label">What tense is this? (${moodLabel(q.mood)})</div>
    <div style="font-size:1.1rem;font-weight:600;margin-bottom:20px;">${sample}</div>
    <div class="choices" id="choices">
      ${q.choices.map((c, i) => `
        <button class="choice-btn" id="choice-${i}" onclick="submitModeB(${i})" data-correct="${c.correct}">
          ${c.tense} <span style="color:#9ca3af;font-size:0.8rem;">(${c.mood})</span>
        </button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
  `;
}

function renderModeC(q) {
  const persons = PERSONS.map((p, i) => ({ p, i }))
    .filter(({ i }) => sessionSetup.selectedPersons.has(i));
  return `
    <div class="question-prompt">${q.verb}</div>
    ${tenseHeader(q.mood, q.tense)}
    ${sessionSetup.showHints ? renderExampleHint(q.example, null) : ''}
    <table class="fill-table">
      ${persons.map(({ p, i }) => `
        <tr>
          <td class="person-cell">${p}</td>
          <td><input class="fill-input" id="fill-${i}" data-idx="${i}" type="text"
            autocomplete="off" autocorrect="off" spellcheck="false"></td>
        </tr>`).join('')}
    </table>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-primary" onclick="submitModeC()">Check all</button>
  `;
}

function nextQuestion(scored, outOf, key, answers) {
  Progress.record(key, scored === outOf);
  sessionResults.push({ ...currentQueue[currentIndex], scored, outOf, answers });
  const feedbackEl = document.getElementById('feedback');

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;margin-top:14px;';

  if (currentIndex > 0) {
    const backBtn = document.createElement('button');
    backBtn.className = 'btn btn-secondary';
    backBtn.textContent = '\u2190 Back';
    backBtn.onclick = goBack;
    row.appendChild(backBtn);
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn btn-primary';
  nextBtn.textContent = 'Next \u2192';
  nextBtn.onclick = goToNext;
  row.appendChild(nextBtn);

  feedbackEl.after(row);
  setTimeout(() => nextBtn.focus(), 50);
}

function goToNext() {
  currentIndex++;
  renderPractice();
}

function goBack() {
  sessionResults.pop(); // undo current answer
  currentIndex--;
  sessionResults.pop(); // undo previous answer so it can be re-tried
  renderPractice();
}

function submitModeA() {
  const q = currentQueue[currentIndex];
  const input = document.getElementById('answer-input');
  const feedback = document.getElementById('feedback');
  if (!input || input.disabled) return;

  const expected = typeof q.forms === 'string' ? q.forms : q.forms[q.personIndex];
  const result = checkAnswer(input.value, expected);
  const key = `${q.verb}|${q.mood}|${q.tense}`;

  input.disabled = true;
  document.querySelector('[onclick="submitModeA()"]').disabled = true;

  const given = input.value.trim();
  if (result === 'correct') {
    input.classList.add('correct');
    feedback.className = 'feedback correct';
    feedback.textContent = '✓ Correct!';
    nextQuestion(1, 1, key, { given, expected });
  } else if (result === 'accent-only') {
    input.classList.add('accent');
    feedback.className = 'feedback accent';
    feedback.innerHTML = `⚠ Check accents — answer: <strong>${expected}</strong>`;
    nextQuestion(0, 1, key, { given, expected });
  } else {
    input.classList.add('wrong');
    feedback.className = 'feedback wrong';
    feedback.innerHTML = `✗ Correct answer: <strong>${expected}</strong>`;
    nextQuestion(0, 1, key, { given, expected });
  }
}

function submitModeB(choiceIndex) {
  const q = currentQueue[currentIndex];
  const feedback = document.getElementById('feedback');
  const buttons = document.querySelectorAll('.choice-btn');
  buttons.forEach(b => b.disabled = true);

  const choice = q.choices[choiceIndex];
  const correct = choice.correct;
  const key = `${q.verb}|${q.mood}|${q.tense}`;

  buttons.forEach((b, i) => {
    if (q.choices[i].correct) b.classList.add('correct-reveal');
    else if (i === choiceIndex && !correct) b.classList.add('wrong-reveal');
  });

  feedback.className = correct ? 'feedback correct' : 'feedback wrong';
  feedback.textContent = correct ? '✓ Correct!' : `✗ That was: ${q.tense} (${q.mood})`;
  nextQuestion(correct ? 1 : 0, 1, key, { given: choice.tense, expected: q.tense });
}

function submitModeC() {
  const q = currentQueue[currentIndex];
  const feedback = document.getElementById('feedback');
  const inputs = document.querySelectorAll('.fill-input');
  const key = `${q.verb}|${q.mood}|${q.tense}`;
  const mistakes = [];
  let correctCount = 0;
  const totalCount = inputs.length;

  inputs.forEach(inp => {
    inp.disabled = true;
    const idx = parseInt(inp.dataset.idx);
    const expected = q.forms[idx];
    const result = checkAnswer(inp.value, expected);
    if (result === 'correct') {
      inp.classList.add('correct');
      correctCount++;
    } else if (result === 'accent-only') {
      inp.classList.add('accent');
      inp.insertAdjacentHTML('afterend', `<span class="correction accent-correction">${expected}</span>`);
      mistakes.push({ person: PERSON_SHORT[idx], given: inp.value.trim(), expected });
    } else {
      inp.classList.add('wrong');
      inp.insertAdjacentHTML('afterend', `<span class="correction wrong-correction">${expected}</span>`);
      mistakes.push({ person: PERSON_SHORT[idx], given: inp.value.trim(), expected });
    }
  });

  document.querySelector('[onclick="submitModeC()"]').disabled = true;
  feedback.className = correctCount === totalCount ? 'feedback correct' : 'feedback wrong';
  feedback.textContent = correctCount === totalCount ? '✓ All correct!' : `✗ ${correctCount}/${totalCount} correct`;
  nextQuestion(correctCount, totalCount, key, { mistakes });
}

function renderMistakeDetail(r) {
  const label = `<strong>${r.verb}</strong> · ${r.tense} <span style="color:#9ca3af;font-size:0.8rem;">(${moodLabel(r.mood)})</span>`;
  if (r.mode === 'C') {
    const rows = r.answers.mistakes.map(m =>
      `<div style="margin-left:12px;font-size:0.85rem;">${m.person}: <span style="color:#dc2626;text-decoration:line-through;">${m.given || '—'}</span> → <span style="color:#16a34a;font-weight:600;">${m.expected}</span></div>`
    ).join('');
    return `<li>${label}${rows}</li>`;
  }
  // Mode A or B
  const { given, expected } = r.answers;
  const person = r.mode === 'A' && r.personIndex != null ? ` (${PERSON_SHORT[r.personIndex]})` : '';
  return `<li>${label}${person}<div style="margin-left:12px;font-size:0.85rem;"><span style="color:#dc2626;text-decoration:line-through;">${given || '—'}</span> → <span style="color:#16a34a;font-weight:600;">${expected}</span></div></li>`;
}

function renderResults() {
  const total = sessionResults.reduce((s, r) => s + r.outOf, 0);
  const correct = sessionResults.reduce((s, r) => s + r.scored, 0);
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  const wrong = sessionResults.filter(r => r.scored < r.outOf);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card" style="text-align:center;padding:32px 20px;">
      <div class="score-big">${correct} / ${total}</div>
      <div class="score-pct">${pct}% correct</div>
    </div>

    ${wrong.length > 0 ? `
      <div class="card">
        <h3>Mistakes</h3>
        <ul class="weak-list">
          ${wrong.map(r => renderMistakeDetail(r)).join('')}
        </ul>
        <p style="font-size:0.8rem;color:#9ca3af;margin-top:10px;">
          Progress saved — weak tenses will appear more often next session.
        </p>
      </div>` : `
      <div class="card" style="text-align:center;color:#16a34a;font-weight:600;">
        Perfect session! 🎉
      </div>`}

    <div class="action-row">
      <button class="btn btn-secondary" onclick="practiceAgain()">Practice again</button>
      <button class="btn btn-primary" onclick="renderSetup()">New session</button>
    </div>
  `;
}

function practiceAgain() {
  const { selectedVerbs, selectedTenses, count, selectedPersons } = sessionSetup;
  currentQueue = buildQueue(selectedVerbs, selectedTenses, count, selectedPersons);
  currentIndex = 0;
  sessionResults = [];
  renderPractice();
}

function renderSetup() {
  const weak = getWeakTenses();
  const s = loadSettings();
  const app = document.getElementById('app');
  app.innerHTML = `
    <h1>Verbos Irregulares</h1>
    <p class="subtitle">Configure your practice session</p>

    <div class="card">
      <h3>Verbs</h3>
      <div class="chip-group" id="verb-chips">
        ${Object.keys(VERBS).map(v => {
          const on = s.verbs.includes(v);
          return `<label class="chip${on ? ' selected' : ''}" id="chip-${v}">
            <input type="checkbox" ${on ? 'checked' : ''} data-verb="${v}" onchange="updateChip(this)">
            ${v}
          </label>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <h3>Tenses</h3>
      ${Object.entries(TENSE_GROUPS).map(([mood, tenses]) => `
        <div class="tense-group">
          <div class="tense-group-label">${mood}</div>
          <div class="chip-group">
            ${tenses.map(t => {
              const isWeak = weak.some(w => w.includes('|' + t));
              const on = (s.tenses[mood] || []).includes(t);
              return `<label class="chip${on ? ' selected' : ''}" id="chip-${mood}-${t.replace(/ /g,'_')}">
                <input type="checkbox" ${on ? 'checked' : ''} data-mood="${mood}" data-tense="${t}" onchange="updateChip(this)">
                ${t}${isWeak ? ' ⚠️' : ''}
              </label>`;
            }).join('')}
          </div>
        </div>`).join('')}
    </div>

    <div class="card">
      <h3>Persons</h3>
      <div class="chip-group" id="person-chips">
        ${PERSON_SHORT.map((label, i) => {
          const on = s.persons.includes(i);
          return `<label class="chip${on ? ' selected' : ''}" id="chip-person-${i}">
            <input type="checkbox" ${on ? 'checked' : ''} data-person="${i}" onchange="updateChip(this)">
            ${label}
          </label>`;
        }).join('')}
      </div>
      <div class="count-row">
        <label for="q-count">Questions:</label>
        <input type="number" id="q-count" value="${s.count}" min="1" max="100">
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="show-hints" ${s.showHints ? 'checked' : ''}>
        <label for="show-hints">Show example hints</label>
      </div>
      <button class="btn btn-primary btn-full" id="start-btn" onclick="startSession()">Start session</button>
      <button class="btn btn-secondary btn-full" style="margin-top:8px;" onclick="resetSettings()">Reset defaults</button>
    </div>
  `;
  updateStartButton();
}

function updateChip(el) {
  const label = el.closest('.chip');
  if (el.checked) label.classList.add('selected');
  else label.classList.remove('selected');
  updateStartButton();
}

function updateStartButton() {
  const anyVerb = [...document.querySelectorAll('[data-verb]')].some(el => el.checked);
  const anyTense = [...document.querySelectorAll('[data-tense]')].some(el => el.checked);
  const anyPerson = [...document.querySelectorAll('[data-person]')].some(el => el.checked);
  document.getElementById('start-btn').disabled = !(anyVerb && anyTense && anyPerson);
}

function startSession() {
  const selectedVerbs = [...document.querySelectorAll('[data-verb]:checked')].map(el => el.dataset.verb);
  const selectedTenses = { Indicativo: [], Subjuntivo: [], Imperativo: [], FormasNominais: [] };
  document.querySelectorAll('[data-tense]:checked').forEach(el => {
    selectedTenses[el.dataset.mood].push(el.dataset.tense);
  });
  const count = Math.max(1, Math.min(100, parseInt(document.getElementById('q-count').value) || 10));
  const selectedPersons = new Set(
    [...document.querySelectorAll('[data-person]:checked')].map(el => parseInt(el.dataset.person))
  );
  const showHints = document.getElementById('show-hints').checked;

  saveSettings({
    verbs: selectedVerbs,
    tenses: selectedTenses,
    persons: [...selectedPersons],
    count,
    showHints,
  });

  sessionSetup = { selectedVerbs, selectedTenses, count, selectedPersons, showHints };
  currentQueue = buildQueue(selectedVerbs, selectedTenses, count, selectedPersons);
  currentIndex = 0;
  sessionResults = [];
  renderPractice();
}

// Expose event handlers to global scope (inline onclick needs window access from inside IIFE)
window.updateChip = updateChip;
window.startSession = startSession;
window.submitModeA = submitModeA;
window.submitModeB = submitModeB;
window.submitModeC = submitModeC;
window.practiceAgain = practiceAgain;
window.renderSetup = renderSetup;
window.goToNext = goToNext;
window.goBack = goBack;
window.resetSettings = resetSettings;

renderSetup();

})();
  </script>
</body>
</html>
